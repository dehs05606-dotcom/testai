version: '3.8'

services:
  # 🚀 MOST ADVANCED AI ASSISTANT API
  advanced-ai-api:
    build: 
      context: .
      dockerfile: Dockerfile.advanced
    ports:
      - "12000:12000"
      - "12001:12001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyDxzcuwVpOy_2-Ze61AVduJHUVKTJKiaYc}
      - MOCK_MODE=${MOCK_MODE:-true}
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=advanced_ai
      - POSTGRES_USER=ai_user
      - POSTGRES_PASSWORD=ai_password
      - JWT_SECRET=advanced-ai-secret-key
      - DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - postgres
      - elasticsearch
    volumes:
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12000/health/advanced"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🗄️ REDIS CACHE
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # 🐘 POSTGRESQL DATABASE
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=advanced_ai
      - POSTGRES_USER=ai_user
      - POSTGRES_PASSWORD=ai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-network
    restart: unless-stopped

  # 🔍 ELASTICSEARCH FOR ADVANCED SEARCH
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ai-network
    restart: unless-stopped

  # 📊 PROMETHEUS MONITORING
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ai-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # 📈 GRAFANA DASHBOARD
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - ai-network
    restart: unless-stopped

  # 🌸 FLOWER CELERY MONITORING
  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - ai-network
    restart: unless-stopped

  # 🔄 CELERY WORKER
  celery-worker:
    build: 
      context: .
      dockerfile: Dockerfile.advanced
    command: celery -A advanced_ai_engine worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      - redis
      - postgres
    volumes:
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    networks:
      - ai-network
    restart: unless-stopped

  # 🔄 CELERY BEAT SCHEDULER
  celery-beat:
    build: 
      context: .
      dockerfile: Dockerfile.advanced
    command: celery -A advanced_ai_engine beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - ai-network
    restart: unless-stopped

  # 🌐 NGINX REVERSE PROXY
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - advanced-ai-api
    networks:
      - ai-network
    restart: unless-stopped

  # 📊 VECTOR DATABASE (QDRANT)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-network
    restart: unless-stopped

  # 🔍 JAEGER TRACING
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ai-network
    restart: unless-stopped

  # 📝 LOGSTASH
  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logs:/app/logs
    depends_on:
      - elasticsearch
    networks:
      - ai-network
    restart: unless-stopped

  # 📊 KIBANA
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ai-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  qdrant_data:

networks:
  ai-network:
    driver: bridge