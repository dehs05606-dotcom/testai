version: '3.8'

services:
  gemini-assistant:
    build: .
    ports:
      - "12000:12000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyDxzcuwVpOy_2-Ze61AVduJHUVKTJKiaYc}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
      - HOST=0.0.0.0
      - PORT=12000
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for session storage (for production)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - production

  # Optional: Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gemini-assistant
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data: